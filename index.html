<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sorgu Paneli</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; padding: 50px; }
        input { padding: 10px; width: 300px; border-radius: 5px; border: none; }
        button { padding: 10px 20px; background: #e50914; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #sonuc { margin-top: 20px; background: #1f1f1f; padding: 20px; border-radius: 5px; text-align: left; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Discord Sorgu Paneli</h1>
    <input type="text" id="input" placeholder="ID veya Email gir...">
    <button onclick="ara()">Sorgula</button>
    <pre id="sonuc">Sonuç burada görünecek...</pre>

    <script>
        async function ara() {
            const val = document.getElementById("input").value;
            const type = val.includes("@") ? "email" : "id";
            const res = await fetch(`/api/sorgula?${type}=${val}`);
            const data = await res.json();
            document.getElementById("sonuc").innerText = JSON.stringify(data, null, 2);
        }
    </script>
</body>
</html>
